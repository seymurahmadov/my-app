stages:          # List of stages for jobs, and their order of execution
  - docker-build
  - deploy-staging
  - deploy-prod

docker-build:       # This job runs in the build stage, which runs first.
  stage: docker-build
  script:
    - echo "Compiling the code..."
    - echo "Compile complete."

deploy-staging:   # This job runs in the test stage.
  stage: deploy-staging    # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Running unit tests... This will take about 60 seconds."
    - sleep 60
    - echo "Code coverage is 90%"

deploy-prod:   # This job also runs in the test stage.
  stage: deploy-prod  # It only runs when *both* jobs in the test stage complete successfully.
  environment: production
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."