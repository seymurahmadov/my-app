name: CI Pipeline

on:
  push:
    branches:
      - main   # yalnız main branch-ə push olanda işə düşəcək

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build the code
        run: |
          echo "Compiling the code..."
          echo "Compile complete."

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: docker-build   # build tamam olandan sonra işə düşür
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          echo "Running unit tests... This will take about 60 seconds."
          sleep 60
          echo "Code coverage is 90%"

  deploy-prod:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: deploy-staging   # staging tamam olandan sonra işə düşür
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Application
        run: |
          echo "Deploying application..."
          echo "Application successfully deployed."
